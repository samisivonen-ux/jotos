name: Deploy web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: jotos-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone
        run: npm run build
        env:
          VITE_MML_API_KEY: ${{ secrets.VITE_MML_API_KEY }}

      - name: Build connected variant
        run: npm run build:connect
        env:
          VITE_MML_API_KEY: ${{ secrets.VITE_MML_API_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload standalone app
        run: |
          aws s3 sync dist "s3://${{ vars.AWS_WEB_BUCKET }}" --delete --exclude "connect/*" \
            --exclude "index.html" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${{ vars.AWS_WEB_BUCKET }}/index.html" \
            --cache-control "no-cache" --content-type "text/html"

      - name: Upload connected app
        run: |
          aws s3 sync dist-connect "s3://${{ vars.AWS_WEB_BUCKET }}/connect" --delete \
            --exclude "index.html" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist-connect/index.html "s3://${{ vars.AWS_WEB_BUCKET }}/connect/index.html" \
            --cache-control "no-cache" --content-type "text/html"

      - name: Invalidate CDN
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

      - name: Smoke test production
        run: |
          probe() {
            local url="$1"
            for attempt in 1 2 3 4 5; do
              if curl -fsS "$url" | grep -q "<title>Jotos</title>"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          probe https://d3dom5aih0p5.cloudfront.net/
          probe https://d3dom5aih0p5.cloudfront.net/connect/
